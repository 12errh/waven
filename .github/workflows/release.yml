name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v3.1.0

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
      - run: go test -tags gtk3 ./internal/... .
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test

  linux:
    name: Linux (.deb + AppImage)
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libunwind-dev libgstreamer1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Frontend dependencies
        run: npm --prefix frontend ci
      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0" >> "$GITHUB_ENV"
          fi
      - name: Build .deb
        run: PATH="$HOME/go/bin:$PATH" wails3 task package:linux:deb VERSION="$VERSION" ARCH=amd64
      - name: Build AppImage
        run: PATH="$HOME/go/bin:$PATH" wails3 task package:linux:appimage VERSION="$VERSION" ARCH=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: waven-linux
          path: |
            bin/*.deb
            bin/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION
        shell: pwsh
      - name: Frontend dependencies
        run: npm --prefix frontend ci
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            "VERSION=$($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_ENV
          } else {
            "VERSION=0.1.0" >> $env:GITHUB_ENV
          }
      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\go\bin;$env:PATH"
          wails3 task package:windows VERSION=$env:VERSION ARCH=amd64
      - uses: actions/upload-artifact@v4
        with:
          name: waven-windows
          path: bin/*installer.exe
          if-no-files-found: error

  macos:
    name: macOS (.app + .dmg, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: amd64
            runner: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - name: Frontend dependencies
        run: npm --prefix frontend ci
      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.0" >> "$GITHUB_ENV"
          fi
      - name: Build .app and .dmg
        run: PATH="$HOME/go/bin:$PATH" wails3 task package:darwin VERSION="$VERSION" ARCH=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: waven-macos-${{ matrix.arch }}
          path: |
            bin/waven-darwin-${{ matrix.arch }}.dmg
            bin/waven.app/**
          if-no-files-found: error
