version: '3'

# Keep DEV_PORT in sync with the literal port inside build/config.yml: the
# `wails3 dev` readiness check does not expand environment variables.
vars:
  APP_NAME: waven
  DEV_PORT: '9245'
  VERSION: '{{.VERSION | default "0.1.0"}}'
  LDFLAGS: '-s -w -X waven/internal/desktop.Version={{.VERSION}}'
  # Wails defaults to GTK4 on Linux. Pinning GTK3 keeps builds compatible with
  # Ubuntu 22.04 (the CI runner) and matches the .deb dependencies. The tag is
  # ignored on Windows and macOS.
  BUILD_TAGS: 'production,gtk3'

tasks:
  generate:bindings:
    summary: Regenerate the TypeScript bridge from the Go services
    cmds:
      - wails3 generate bindings -ts

  generate:icons:
    summary: Generate Windows and macOS icons from build/appicon.png
    cmds:
      - wails3 generate icons -input build/appicon.png -windowsfilename build/windows/icon.ico -macfilename build/darwin/icon.icns

  dev:
    summary: Run WAVEN with Next.js HMR and Go hot restart
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.DEV_PORT}}

  build:frontend:
    summary: Export the Next.js frontend to frontend/out
    dir: frontend
    cmds:
      - npm run build

  build:
    summary: Build the production desktop binary
    cmds:
      - task: generate:bindings
      - task: build:frontend
      - mkdir -p bin
      - go build -tags {{.BUILD_TAGS}} -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}}" -o bin/waven .

  build:dev:
    summary: Build a development binary that serves the exported frontend from disk
    cmds:
      - mkdir -p bin
      - go build -buildvcs=false -gcflags=all="-l" -o bin/waven-dev .

  run:
    summary: Build and launch the production binary
    deps:
      - task: build
    cmds:
      - ./bin/waven

  test:
    summary: Run Go vet/tests and the frontend lint, typecheck, and unit tests
    cmds:
      # Scoped to real packages: frontend/node_modules ships Go sources that
      # `./...` would otherwise try to compile.
      - go vet ./internal/... .
      - go test -tags gtk3 ./internal/... .
      - npm --prefix frontend run lint
      - npm --prefix frontend run typecheck
      - npm --prefix frontend test

  # ---------------------------------------------------------------------------
  # Platform builds. CI calls these on native runners; ARCH selects the target.
  # ---------------------------------------------------------------------------

  generate:syso:
    summary: Generate the Windows version resource from the icon, manifest, and info
    cmds:
      - wails3 generate syso -arch {{.ARCH | default "amd64"}} -icon build/windows/icon.ico -manifest build/windows/waven.exe.manifest -info build/windows/info.json -out waven_windows_{{.ARCH | default "amd64"}}.syso

  build:windows:
    summary: Build the Windows executable (CGO-free Wails backend)
    cmds:
      - task: generate:bindings
      - task: build:frontend
      - task: generate:icons
      - task: generate:syso
      - go build -tags {{.BUILD_TAGS}} -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}} -H windowsgui" -o bin/waven.exe .
    env:
      GOOS: windows
      CGO_ENABLED: 0
      GOARCH: '{{.ARCH | default "amd64"}}'

  create:nsis:installer:
    summary: Run makensis from its script directory so relative OutFile paths resolve
    dir: build/windows/nsis
    cmds:
      - makensis -DINFO_PRODUCTVERSION={{.VERSION}} -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}/bin/waven.exe" project.nsi

  package:windows:
    summary: Build the Windows NSIS per-user installer
    cmds:
      - task: build:windows
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - task: create:nsis:installer

  build:darwin:
    summary: Build the macOS binary for the selected architecture
    cmds:
      - task: generate:bindings
      - task: build:frontend
      - task: generate:icons
      - go build -tags {{.BUILD_TAGS}} -trimpath -buildvcs=false -ldflags="{{.LDFLAGS}}" -o bin/waven .
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default "arm64"}}'
      CGO_CFLAGS: '-mmacosx-version-min=12.0'
      CGO_LDFLAGS: '-mmacosx-version-min=12.0'
      MACOSX_DEPLOYMENT_TARGET: '12.0'

  package:darwin:
    summary: Create the macOS .app bundle and .dmg for the selected architecture
    cmds:
      - task: build:darwin
      - mkdir -p bin/waven.app/Contents/MacOS bin/waven.app/Contents/Resources
      - cp build/darwin/icon.icns bin/waven.app/Contents/Resources/
      - cp bin/waven bin/waven.app/Contents/MacOS/
      - sed "s/0[.]1[.]0/{{.VERSION}}/g" build/darwin/Info.plist > bin/waven.app/Contents/Info.plist
      - codesign --force --deep --sign - bin/waven.app
      - wails3 tool package -name waven -format dmg -out bin
      - mv bin/waven.dmg bin/waven-darwin-{{.ARCH | default "arm64"}}.dmg

  package:linux:deb:
    summary: Build the Linux .deb package
    cmds:
      - task: build
      - WAVEN_VERSION={{.VERSION}} wails3 tool package -name waven -format deb -config ./build/linux/nfpm/nfpm.yaml -out ./bin
      - mv bin/waven.deb bin/waven-linux-{{.ARCH | default "amd64"}}.deb
    env:
      GOARCH: '{{.ARCH | default "amd64"}}'

  package:linux:appimage:
    summary: Build the Linux AppImage (best effort; downloads the AppImage runtime)
    cmds:
      - task: build
      - mkdir -p build/linux/appimage
      - cp bin/waven build/linux/appimage/waven
      - wails3 generate appimage -binary build/linux/appimage/waven -icon build/appicon.png -desktopfile build/linux/waven.desktop -outputdir bin -builddir build/linux/appimage/build

  clean:
    summary: Remove local build output
    cmds:
      - rm -rf bin frontend/out frontend/.next
